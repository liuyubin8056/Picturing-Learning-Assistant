    <meta name="description" content="Picturing 智能拍照学习助手：拍下题目，AI 分步讲解、诊断薄弱点并生成针对性练习。" />
    <title>拍照答疑 · 智能拍照学习助手</title>
    <script>
      // 首屏前应用主题，避免深色模式闪白；默认浅色
      ;(function () {
        try {
          var saved = localStorage.getItem('spl_theme')
          var dark = saved === 'dark'
            || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var t = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'dark' ? '#0A0F1E' : '#F4F6FD')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
