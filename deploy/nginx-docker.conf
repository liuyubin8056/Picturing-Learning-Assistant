# 容器内 Nginx 配置（挂载到 /etc/nginx/conf.d/default.conf）
# 与宿主机版 nginx-learnmate.conf 的区别：
#   1. 上游写服务名 api:8000（compose 内网 DNS）
#   2. 静态目录是容器内路径

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    client_body_timeout 60s;

    # ---------- 压缩 ----------
    # 首屏 JS+CSS+HTML 约 516KB，gzip 后 160KB
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml application/manifest+json;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型答疑 30~90s，慢时 2~3 分钟；默认 60s 会 504
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 图片：Nginx 直发，不经过 Python ----------
    location /kb_images/ {
        alias /var/www/kb_images/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    # 题库人工校对页（HTML 由后端返回）
    location = /review {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- 前端静态 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 发版后必须让用户拿到新 index.html
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
