# 智能拍照学习助手 · 容器编排
#
# 用法（在项目根目录）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f api
#   docker compose -f deploy/docker-compose.yml down
#
# 内存预算（2G 机器）：api ≤ 1G、web ≤ 128M、Docker 引擎约 80M，合计约 300~400M。

name: learnmate

services:
  # ---------------- 后端 API ----------------
  api:
    build:
      context: ..                        # 项目根目录
      dockerfile: deploy/Dockerfile
    image: learnmate-api:latest
    container_name: learnmate-api
    restart: unless-stopped

    # 密钥与模型配置来自 backend/.env（不进镜像、不进仓库）
    env_file:
      - ../backend/.env
    environment:
      # 覆盖 .env 里的宿主机绝对路径：容器内数据库固定落在 /app/dev.db
      DATABASE_URL: sqlite:////app/dev.db
      TZ: Asia/Shanghai

    volumes:
      - ../backend/dev.db:/app/dev.db                    # 数据持久化
      - ../backend/kb_images:/app/kb_images:ro           # 题库图只读
      - ../backend/uploads:/app/uploads                  # 用户上传原图

    expose:
      - "8000"          # 只在内部网络暴露，公网进不来
    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- 前端 + 反向代理 ----------------
  web:
    image: nginx:1.27-alpine
    container_name: learnmate-web
    restart: unless-stopped

    ports:
      - "80:80"
      # 配好 HTTPS 后再放开：
      # - "443:443"

    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro        # 前端构建产物
      - ../backend/kb_images:/var/www/kb_images:ro       # 图片由 Nginx 直发
      - ../backend/uploads:/var/www/uploads:ro
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      api:
        condition: service_started

    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
