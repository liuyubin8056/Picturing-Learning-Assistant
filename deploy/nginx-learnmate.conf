# 智能拍照学习助手 · Nginx 站点配置
# 部署位置：/etc/nginx/sites-available/learnmate
# 启用：    ln -s /etc/nginx/sites-available/learnmate /etc/nginx/sites-enabled/
# 校验：    nginx -t  &&  systemctl reload nginx
#
# 目录约定（deploy.sh 会按这个结构铺好）：
#   /opt/learnmate/frontend/dist   前端构建产物
#   /opt/learnmate/backend         后端代码 + .venv
#   /opt/learnmate/backend/kb_images  题库图片（约 73MB）
#   /opt/learnmate/backend/uploads    用户上传的原图

server {
    listen 80;
    # 有域名后改成 server_name example.com www.example.com;
    server_name _;

    root /opt/learnmate/frontend/dist;
    index index.html;

    # 学生手写解答照片一般在 2~5MB，留足余量
    client_max_body_size 20m;
    client_body_timeout 60s;

    # ---------- 压缩（1M 带宽下这是最关键的一项）----------
    # 前端首屏未压缩约 1.7MB，gzip 后约 550KB，1Mbps 下从 14s 降到 4s
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml application/manifest+json;
    # 注意：woff2 / png 本身已压缩，不要再 gzip

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型答疑实测 30~90s，推理慢时可达 2~3 分钟。
        # Nginx 默认 60s 会直接 504，这里是必须改的一项。
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 长响应不缓冲，避免用户等 90s 后才一次性收到
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 图片：交给 Nginx 直接发，不走 Python ----------
    # 比 FastAPI 的 StaticFiles 快，也不占用后端进程内存
    location /kb_images/ {
        alias /opt/learnmate/backend/kb_images/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location /uploads/ {
        alias /opt/learnmate/backend/uploads/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    # 题库人工校对页（返回 HTML，由后端读模板）
    location = /review {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- 前端静态资源 ----------
    # Vite 产物文件名带内容 hash，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不能缓存，否则发版后用户还在跑旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # hash 路由下其实不需要 fallback，但保留可兼容以后换 history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# HTTPS 版本（等你有域名 + 完成备案后启用）
# ------------------------------------------------------------
# 1) 安装 certbot：
#      apt install -y certbot python3-certbot-nginx
# 2) 把上面的 server_name 改成你的域名，reload 一次
# 3) 签证书（会自动改写本文件、加 443 段并启用 HTTP→HTTPS 跳转）：
#      certbot --nginx -d example.com -d www.example.com
# 4) 自动续期由 certbot.timer 负责，验证：certbot renew --dry-run
#
# 更省事的替代方案是 Caddy（自动申请证书、配置十行）：
#   example.com {
#       root * /opt/learnmate/frontend/dist
#       encode gzip
#       handle /api/* {
#           reverse_proxy 127.0.0.1:8000 {
#               transport http { read_timeout 300s }
#           }
#       }
#       handle /kb_images/* { root * /opt/learnmate/backend }
#       handle /uploads/*   { root * /opt/learnmate/backend }
#       try_files {path} /index.html
#       file_server
#   }
# ============================================================
